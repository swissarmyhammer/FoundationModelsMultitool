name: CI

# Delegates to the shared swift-ci workflow.
#
# This workflow was repo-local while the shared swift-ci could not run a
# nested integration package. Workflows commit 0580114 added the
# `integration-package-path` input, so the shared workflow now gives the
# same guarantees the repo-local jobs gave:
#
# - The unit job builds the nested package on every run. The root build does
#   not compile a nested package, so this coupling keeps a broken
#   integration test visible between the runs that execute it.
# - The integration job builds the nested package, copies the mlx metallib
#   beside each `.xctest` bundle, and runs
#   `swift test --package-path IntegrationTests`.
# - The integration job declares `needs: test`, so a unit failure reports in
#   minutes and no long integration run starts on a broken tree.
#
# `CIWorkflowTests` pins this call and its inputs.
#
# The unit/integration split is structural. The root `Package.swift` declares
# no integration target: the real-model suite is its own package under
# `IntegrationTests/`, so `swift test` at the root cannot reach it. No input
# below sets an environment variable to select a suite, and none may start
# doing so.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # The real-model suite is a nested package. This input makes the unit
      # job build it on every run and makes the integration job run it.
      integration-package-path: IntegrationTests

      # `--no-parallel` is not a preference. Swift Testing starts a test's
      # `.timeLimit` when the test starts, and every scenario queues behind
      # `LiveProfileTurnstile` for the one resident live profile — so a
      # parallel run spends the limit on queue time and a queued suite fails
      # in the same way as a hang. `LiveRouterFixture.swift` carries the
      # measurements.
      integration-no-parallel: true

      # mlx-swift's Metal backend probes `<binary-dir>/mlx.metallib`, and
      # SwiftPM puts the compiled shader library elsewhere. The shared
      # workflow copies the matched file beside each `.xctest` bundle before
      # the run. `MetalLibraryTestBootstrap` closes the same gap in-process
      # and skips when the file is already there, so the two never fight.
      integration-metallib-glob: "*Cmlx*/default.metallib"
