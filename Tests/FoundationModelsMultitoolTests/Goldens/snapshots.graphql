"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""One checkpoint: a recorded change of the work tree of a session."""
type Checkpoint {
  """The id of the checkpoint: <sessionId>:<index>."""
  id: ID!

  """The position of the checkpoint, from 1 for the oldest checkpoint."""
  index: Int!

  """
  What took the snapshot: 'tool <name> (call <id>)', 'label <text>', 'manual', 'rollback to <index>', 'pending', or 'changed while closed'.
  """
  trigger: String!

  """
  The tool call that took the snapshot, or null when no tool call took it.
  """
  toolCallId: String

  """The files that the checkpoint changed."""
  files: [String!]!

  """The time of the snapshot."""
  at: DateTime!
}

"""The checkpoint to roll the work tree of a session back to."""
input RollbackTimelineInput {
  """
  The id of the session. An external client names only a session that it owns.
  """
  sessionId: ID!

  """The index of the checkpoint to restore. 0 is the baseline."""
  index: Int!
}

"""One new checkpoint of one session that you can see."""
type SnapshotChange {
  """The cursor that resumes the subscription after this change."""
  cursor: String!

  """The time of the change."""
  at: DateTime!

  """The session whose checkpoints changed."""
  sessionId: ID!

  """
  The new checkpoint: query checkpoint(sessionId:index:) for its files and trigger.
  """
  added: [ID!]!

  """The checkpoints that changed: none, a checkpoint never changes."""
  changed: [ID!]!

  """
  The checkpoints that left the timeline: none, a rollback is a new checkpoint.
  """
  removed: [ID!]!
}

type Query {
  """
  The checkpoints of a session, oldest first. An unknown session gives none.
  """
  checkpoints(
    """
    The id of the session. An external client names only a session that it owns.
    """
    sessionId: ID!
  ): [Checkpoint!]!

  """
  One checkpoint of a session, or null when the session has no such checkpoint.
  """
  checkpoint(
    """
    The id of the session. An external client names only a session that it owns.
    """
    sessionId: ID!

    """The index of the checkpoint, from 1."""
    index: Int!
  ): Checkpoint

  """
  The cursor of the newest change. Read the checkpoints, then subscribe to changes after this cursor.
  """
  cursor: String!
}

type Mutation {
  """
  Makes the work tree of a session equal to the tree after a checkpoint. The rollback is a new checkpoint at the end of the timeline, which this gives, and the later checkpoints stay. Null when the work tree already equals that checkpoint. An unknown session gives NOT_FOUND.
  """
  rollbackTimeline(
    """The session and the checkpoint to restore."""
    input: RollbackTimelineInput!
  ): Checkpoint
}

type Subscription {
  """
  The new checkpoints of the sessions that you can see, after a cursor. RESYNC_REQUIRED ends it when a change after the cursor is lost: read the checkpoints and the cursor again, then subscribe with that cursor.
  """
  changes(
    """
    The cursor to resume after, from the cursor query or a change. None: the changes from now.
    """
    after: String

    """
    The session whose changes to give. None: each session that you can see.
    """
    sessionId: ID
  ): SnapshotChange!
}
