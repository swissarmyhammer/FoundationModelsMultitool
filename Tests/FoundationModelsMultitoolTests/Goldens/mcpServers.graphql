"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""How the host reaches an MCP server."""
enum MCPServerTransport {
  """A program on this Mac that speaks MCP on stdio."""
  STDIO

  """A remote endpoint that speaks MCP over http or https."""
  HTTP
}

"""The kind of a change of an MCP server."""
enum MCPServerChangeKind {
  """A new server."""
  ADDED

  """A changed server: a rename, a switch or another field."""
  UPDATED

  """A removed server."""
  REMOVED
}

"""One env variable or one header of an MCP server."""
type MCPServerSetting {
  """The name of the env variable or the header."""
  name: String!

  """The value. For a secret, its keychain: reference."""
  value: String!

  """True when the value is a keychain: reference."""
  secret: Boolean!
}

"""One MCP server of this Mac."""
type MCPServer {
  """The name: the id of the server and the noun of its tools."""
  name: String!

  """True when the host connects the server."""
  enabled: Boolean!

  """How the host reaches the server."""
  transport: MCPServerTransport!

  """The absolute path of the program (STDIO), or null."""
  command: String

  """The arguments of the program (STDIO)."""
  args: [String!]!

  """The env variables of the program (STDIO), sorted by name."""
  env: [MCPServerSetting!]!

  """The url of the endpoint (HTTP), or null."""
  url: String

  """The headers of each request (HTTP), sorted by name."""
  headers: [MCPServerSetting!]!
}

"""
One change of one MCP server, with the whole server, so a client updates one row.
"""
type MCPServerChange {
  """The cursor that resumes the subscription after this change."""
  cursor: String!

  """The time of the change."""
  at: DateTime!

  """The kind of the change."""
  kind: MCPServerChangeKind!

  """The name of the server after the change."""
  name: String!

  """The name of the server before the change. It differs after a rename."""
  previousName: String!

  """The server after the change, or as it was before a remove."""
  server: MCPServer!

  """The name of the server that the change added, or none."""
  added: [ID!]!

  """
  The name of the server that the change changed, after a rename too, or none.
  """
  changed: [ID!]!

  """The name of the server that the change removed, or none."""
  removed: [ID!]!
}

"""One env variable or one header."""
input MCPServerSettingInput {
  """The name of the env variable or the header."""
  name: String!

  """The value."""
  value: String!
}

"""A new MCP server: give a command (STDIO) or a url (HTTP), not both."""
input AddMCPServerInput {
  """
  A name has 1 to 64 characters: lower-case letters, digits, - and _. The first character is a letter.
  """
  name: String!

  """STDIO: the absolute path of the program."""
  command: String

  """STDIO: the arguments of the program."""
  args: [String!]

  """STDIO: the plain env values. Give a secret in envSecrets."""
  env: [MCPServerSettingInput!]

  """HTTP: the http or https url."""
  url: String

  """
  HTTP: the headers. Each value must be a keychain: reference. Give a token in headerSecrets.
  """
  headers: [MCPServerSettingInput!]

  """
  HTTP: Secret values. Each goes to the Keychain of this Mac, and the server keeps only its keychain: reference.
  """
  headerSecrets: [MCPServerSettingInput!]

  """
  STDIO: Secret values. Each goes to the Keychain of this Mac, and the server keeps only its keychain: reference.
  """
  envSecrets: [MCPServerSettingInput!]

  """True to connect the server."""
  enabled: Boolean = true
}

"""
The fields of one MCP server to change. A field that is not given does not change.
"""
input UpdateMCPServerInput {
  """The name of the MCP server."""
  name: String!

  """The new name."""
  newName: String

  """The new program. On an HTTP server, it changes the server to STDIO."""
  command: String

  """The new arguments."""
  args: [String!]

  """The new plain env values: they replace the whole env."""
  env: [MCPServerSettingInput!]

  """The new url. On a STDIO server, it changes the server to HTTP."""
  url: String

  """The new headers: they replace all headers."""
  headers: [MCPServerSettingInput!]

  """
  Secret values. Each goes to the Keychain of this Mac, and the server keeps only its keychain: reference.
  """
  headerSecrets: [MCPServerSettingInput!]

  """
  Secret values. Each goes to the Keychain of this Mac, and the server keeps only its keychain: reference.
  """
  envSecrets: [MCPServerSettingInput!]

  """The new switch."""
  enabled: Boolean
}

"""The MCP server to remove."""
input RemoveMCPServerInput {
  """The name of the MCP server."""
  name: String!
}

"""One MCP server and its new switch."""
input SetMCPServerEnabledInput {
  """The name of the MCP server."""
  name: String!

  """True to turn the server on, false to turn it off."""
  enabled: Boolean!
}

type Query {
  """The MCP servers of this Mac, in their stored order."""
  mcpServers: [MCPServer!]!

  """One MCP server, or null when no server has the name."""
  mcpServer(
    """The name of the MCP server."""
    name: String!
  ): MCPServer

  """
  The cursor of the newest change. Read the servers, then subscribe to changes after it.
  """
  cursor: String!
}

type Mutation {
  """Adds one MCP server after the others. Gives the server."""
  addMCPServer(
    """The new server."""
    input: AddMCPServerInput!
  ): MCPServer!

  """
  Changes the given fields of one MCP server in its place: a rename, the command, the url, and the other fields. A field that is not given does not change. Gives the server.
  """
  updateMCPServer(
    """The server and the fields to change."""
    input: UpdateMCPServerInput!
  ): MCPServer!

  """Removes one MCP server. Gives the server as it was."""
  removeMCPServer(
    """The server."""
    input: RemoveMCPServerInput!
  ): MCPServer!

  """Turns one MCP server on or off. Gives the server."""
  setMCPServerEnabled(
    """The server and its new switch."""
    input: SetMCPServerEnabledInput!
  ): MCPServer!
}

type Subscription {
  """
  The changes of the MCP servers after a cursor, one server each. RESYNC_REQUIRED ends it when a change after the cursor is lost: read the servers and the cursor again, then subscribe.
  """
  changes(
    """
    The cursor to resume after, from the cursor query or a change. None: from now.
    """
    after: String
  ): MCPServerChange!
}
