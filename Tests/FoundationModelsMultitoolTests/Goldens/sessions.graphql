  """
  The text of the name of a row: the title, else the first prompt, else the last prompt. Null when the session has none: then the name of the row is displayDate.
  """
  displayText: String

  """The date of a row: lastDate, else modified."""
  displayDate: DateTime!
}

"""The identity of one session of another agent."""
type ExternalSessionKey {
  """The source agent."""
