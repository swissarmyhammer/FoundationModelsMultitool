}

type Query {
  """
  The sessions on this server that match the filter, the newest first. An external client sees only the sessions that it owns or that its connection started, their subagents, and the sessions that they started.
  """
  sessions(
    """The filter. With no filter, each live session."""
    filter: SessionFilter
  ): [Session!]!

  """
  One page of the sessions on this server that match the filter, in the order of their ids. A session that starts during the read comes on a later page, thus each session shows one time. A page has no archived session unless the filter has the state ARCHIVED. An external client sees only the sessions that it can see, as in sessions.
  """
  sessionPage(
    """
    The filter. Its limit is the page size. Set includeRecorded to get each session that is not archived.
    """
    filter: SessionFilter

    """The nextCursor of the page before, or no cursor for the first page."""
    after: String
  ): SessionPage!

  """
  The sessions on this server whose transcripts match the query by their words or by their meaning, each with its score and its hits. The sessions of the folder argument come first. The search covers only the sessions that this server records. An external client sees only the sessions that it can see, as in sessions. MISSING_SEARCHER when this server cannot search.
  """
  searchSessions(
    """
    The search text: words, "a phrase" and -word, and the tokens @<session>, #<tag>, agent:<id>, folder:<path> (folder:. is the folder argument), from:<kind>, after:YYYY-MM-DD, before:YYYY-MM-DD and is:archived.
    """
    query: String!

    """
    The absolute path of the folder of your tab. Its sessions come first, and folder:. names it. ~ expands.
    """
    folder: String

    """
    One session id. The field then gives each hit of that session, up to first.
    """
    session: ID

    """True to also search the archived sessions."""
    archived: Boolean = false

    """The most sessions to give, or with session the most hits: 1 to 50."""
    first: Int = 20

    """The nextCursor of the page before, or no cursor for the first page."""
    after: String
  ): SessionSearchConnection!

  """One session, or null when no session that you can see has the id."""
  session(
    """The session id, in any letter case."""
    id: ID!
  ): Session

  """
  The unread messages to a session, the oldest first. The query does not mark them read: only the session itself reads its inbox. A session that you cannot see gives none.
  """
  inbox(
    """The session whose messages to read."""
    sessionId: ID!

    """The most messages to give: 1 to 100."""
    limit: Int = 50
  ): [Message!]!

  """
  The Pinned list of this server: each pinned session that you can see, the first pin first. pinSession and unpinSession change it.
  """
  pinnedSessions: [Session!]!

  """
  The Recent list of this server: the sessions that a client opened, the last one first. A pinned session is not in it.
  """
  recentSessions(
    """The most sessions to give: 1 to 100."""
    limit: Int = 20
  ): [Session!]!

  """
  The cursor of the newest change. Read the sessions, then subscribe to changes after this cursor.
  """
  cursor: String!

  """
  The sessions of other agents, such as Claude Code or Codex, that this server can import, the newest first, each with its earlier imports. The sessions of preferredFolder come first; with no preferredFolder, for the agent, the sessions of the folder of its session come first. An import of a session makes a new session also when it has earlier imports. IMPORT_UNAVAILABLE when this server cannot import a session. IMPORT_FAILED when the list fails.
  """
  importableSessions(
    """The source agent: claude-code or codex. None: each agent."""
    agent: String

    """
    The absolute path of the folder of the source sessions. ~ expands. For the agent, . is the folder of its session. A client has no session, so . gives INVALID_FOLDER. None: each folder.
    """
    folder: String

    """
    The absolute path of a folder, for example the folder of your tab. Its sessions come first, then the others: it does not filter. ~ expands. None: for the agent, the folder of its session; for a client, no folder.
    """
    preferredFolder: String

    """The most sessions to give: 1 to 50."""
    first: Int = 20

    """The nextCursor of the page before, or no cursor for the first page."""
    after: String
  ): ImportableSessionPage!

  """
  The sessions of other agents, such as Claude Code or Codex, from the index of this server, the newest first. The query reads the index and never waits for it: the page has the sessions that the index has now and its indexState. With a folder, the index reads the files of that folder first, and externalSessionChanges gives the other sessions later. EXTERNAL_SESSIONS_UNAVAILABLE when this server has no index of the sessions of other agents. EXTERNAL_SESSION_FAILED when the list fails.
  """
  externalSessions(
    """The source agent: claude-code or codex. None: each source."""
    source: String

    """
    The absolute path of the working folder of the sessions. ~ expands. For the agent, . is the folder of its session. A client has no session, so . gives INVALID_FOLDER. None: each folder.
    """
    folder: String

    """
    True to also give the sessions that a program started. False: only the typed sessions.
    """
    automated: Boolean = false

    """The most sessions to give: 1 to 50."""
    first: Int = 20

    """The nextCursor of the page before, or no cursor for the first page."""
    after: String
  ): ExternalSessionPage!
}

type Mutation {
  """
  Starts a new root session of an agent. It works in the background, and only your client opens it in a tab. An external client cannot start a session.
  """
  startSession(
    """The agent, the folder and the first message."""
    input: StartSessionInput!
  ): Session!

  """Adds tags to a session. Gives the session with its tags."""
  tagSession(
    """The session and the tags."""
    input: TagSessionInput!
  ): Session!

  """
  Removes tags from a session. Gives the session with the tags that stay.
  """
  untagSession(
    """The session and the tags."""
    input: UntagSessionInput!
  ): Session!

  """Sets the title of a session."""
  renameSession(
    """The session and its new title."""
    input: RenameSessionInput!
  ): Session!

  """
  Pins a session: it goes into the Pinned list of this server, after the other pins. A second pin keeps its place. Gives the session.
  """
  pinSession(
    """The session."""
    input: PinSessionInput!
  ): Session!

  """
  Unpins a session: it goes out of the Pinned list of this server. Gives the session.
  """
  unpinSession(
    """The session."""
    input: UnpinSessionInput!
  ): Session!

  """
  Archives a session: stops its turn and hides it from the lists. It is not deleted: its transcript and its inbox stay, a message to it waits in its inbox, and unarchiveSession brings it back.
  """
  archiveSession(
    """The session."""
    input: ArchiveSessionInput!
  ): Session!

  """
  Unarchives a session: it shows in the lists again. It stays a recorded session until a client opens it, and its transcript and its inbox are as they were. A session that is not archived gives NOT_ARCHIVED.
  """
  unarchiveSession(
    """The archived session."""
    input: UnarchiveSessionInput!
  ): Session!

  """
  Forks a session: a new session of the kind FORK, in the folder of the source, with the history of the source up to its last completed turn. Then the fork works alone. An archived source gives ARCHIVED_SESSION, and a server that cannot fork gives FORK_UNSUPPORTED. Gives the fork.
  """
  forkSession(
    """The session and the first prompt of the fork."""
    input: ForkSessionInput!
  ): Session!

  """
  Sends a message from you to a session, an agent, a folder or a tag. Gives what happened at each target. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  sendMessage(
    """The address and the text."""
    input: SendMessageInput!
  ): [SendReceipt!]!

  """
  Replies to a message that a session got, from you. Gives what happened at each target. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  replyMessage(
    """The session that got the message, the message and the text."""
    input: ReplyMessageInput!
  ): [SendReceipt!]!

  """
  Shares a session as a read-only link over iCloud sharing. A session that has a share keeps it. Gives the session: its share gives the link and the state, not the content. SHARING_UNAVAILABLE when this server cannot share a session.
  """
  shareSession(
    """The session and the options of a new share."""
    input: ShareSessionInput!
  ): Session!

  """
  Updates the share of a session with the session now. The link does not change. A session with no share gives NOT_SHARED. Gives the session. SHARING_UNAVAILABLE when this server cannot share a session.
  """
  updateSessionShare(
    """The shared session and its switch Keep Updated."""
    input: UpdateSessionShareInput!
  ): Session!

  """
  Stops the share of a session: its link then opens nothing. Copies that people saved stay. A session with no share gives NOT_SHARED. Gives the session. SHARING_UNAVAILABLE when this server cannot share a session.
  """
  stopSharingSession(
    """The shared session."""
    input: StopSharingSessionInput!
  ): Session!

  """
  Imports a session of another agent, such as Claude Code or Codex, as a new session. The import copies the session and does not change the source. Each call makes a new session, also when the source was imported before. Gives the new session. An external client cannot import a session. IMPORT_UNAVAILABLE when this server cannot import a session. NO_SOURCE_ACCESS when the user gave no access to the sessions of the agent, IMPORT_FOLDER_UNAVAILABLE when the folder does not exist or this server cannot write it, and IMPORT_FAILED when the import fails.
  """
  importSession(
    """The source session, and the folder and the name of the new session."""
    input: ImportSessionInput!
  ): Session!

  """
  Continues a session of another agent, such as Claude Code or Codex, in a new session with its full history. The source does not change. Each call makes a new session, also when the source was continued before. Gives the new session. An external client cannot continue a session. EXTERNAL_SESSIONS_UNAVAILABLE when this server has no index of the sessions of other agents. NO_SOURCE_ACCESS when the user gave no access to the sessions of the source: only the user can give access, with the command Allow Access. UNKNOWN_EXTERNAL_SESSION when the index has no such session, FOLDER_UNAVAILABLE when the folder does not exist or this server cannot write it, and EXTERNAL_SESSION_FAILED when the copy fails.
  """
  continueExternalSession(
    """The source session, and the folder and the name of the new session."""
    input: ContinueExternalSessionInput!
  ): Session!
}

type Subscription {
  """
  The changes of the sessions that you can see, after a cursor. RESYNC_REQUIRED ends it when a change after the cursor is lost: read the sessions and the cursor again, then subscribe with that cursor.
  """
  changes(
    """
    The cursor to resume after, from the cursor query or a change. None: the changes from now.
    """
    after: String
  ): SessionChange!

  """
  The changes of the index of the sessions of other agents: the sessions that the index added or changed, the sessions whose files are gone, and the progress of the index. EXTERNAL_SESSIONS_UNAVAILABLE when this server has no index of the sessions of other agents.
  """
  externalSessionChanges(
    """
    The absolute path of the working folder to follow. ~ expands. For the agent, . is the folder of its session. A client has no session, so . gives INVALID_FOLDER. None: each folder.
    """
    folder: String
  ): ExternalSessionChange!

  """
  The history of one session of another agent, in batches, oldest first, for a read-only view. The first batches come while the read of the file continues, and the subscription ends after the last batch. Nothing is written. Stop the subscription to stop the read. EXTERNAL_SESSIONS_UNAVAILABLE when this server has no index of the sessions of other agents. NO_SOURCE_ACCESS when the user gave no access to the sessions of the source: only the user can give access, with the command Allow Access. UNKNOWN_EXTERNAL_SESSION when the index has no such session, and EXTERNAL_SESSION_FAILED when the read fails.
  """
  externalSessionUpdates(
    """The source agent: claude-code or codex."""
    source: String!

    """The sourceId of the session, from externalSessions."""
    id: String!
  ): ExternalSessionUpdateBatch!
}
