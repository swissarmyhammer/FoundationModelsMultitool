"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""The kind of a session."""
enum SessionKind {
  """
  A root session: a client, another session, a message or a trigger started it.
  """
  ROOT

  """A subagent: the agents tool of its parent started it."""
  SUBAGENT

  """A fork: a user forked another session."""
  FORK
}

"""The work state of a session."""
enum SessionState {
  """The session runs a turn."""
  WORKING

  """The session waits for an answer: an elicitation or a permission."""
  NEEDS_INPUT

  """The session runs no turn. A message to it starts a turn."""
  IDLE

  """The session ended. It is never live."""
  ARCHIVED
}

"""How a session started."""
enum SessionOrigin {
  """A client started it."""
  CLIENT

  """The sessions tool of another session started it."""
  TOOL

  """A message to an agent with no session started it."""
  MESSAGE

  """A trigger, for example of a kanban task, started it."""
  TRIGGER

  """A user forked another session."""
  FORK
}

"""What happened to a message at one target."""
enum SendOutcome {
  """The target was idle: the message starts a turn."""
  DELIVERED

  """The target works: the message waits for the end of its turn."""
  QUEUED

  """An agent with no live session started one with the message."""
  STARTED

  """A loop guard, an archived target or no match refused the message."""
  REFUSED
}

"""One session on this server."""
type Session {
  """The session id: a ULID."""
  id: ID!

  """The id of the agent in the agent catalog."""
  agentId: String!

  """The display name of the agent, or null."""
  agentName: String

  """The absolute path of the working folder."""
  cwd: String!

  """The title, or null when no user or session gave one."""
  title: String

  """The tags, sorted."""
  tags: [String!]!

  """The kind of the session."""
  kind: SessionKind!

  """The work state of the session."""
  state: SessionState!

  """How the session started."""
  origin: SessionOrigin!

  """
  A subagent: its parent. A fork: the original. Else, or when you cannot see it, null.
  """
  parent: Session

  """The session that started this root session, or null."""
  startedBy: Session

  """The subagents of this session, live or not, the newest first."""
  children: [Session!]!

  """The time the session started."""
  createdAt: DateTime!

  """The time of the last change of its facts or state."""
  updatedAt: DateTime!

  """The last final message, cut short, or null."""
  lastSummary: String

  """True when the session is in memory now."""
  isLive: Boolean!

  """The count of the unread messages to this session."""
  unreadCount: Int!
}

"""The session or the user that sent a message."""
type Sender {
  """
  The session that sent the message, or null for a user or a session you cannot see.
  """
  session: Session

  """The client of the user that sent it, or null."""
  clientId: String
}

"""One message that a session or a user sent to a session."""
type Message {
  """The message id: a ULID. A reply names it."""
  id: ID!

  """The session or the user that sent the message."""
  from: Sender!

  """The session that the message went to."""
  to: Session!

  """The text of the message. It is untrusted input."""
  text: String!

  """The message that this message answers, or null."""
  inReplyTo: ID

  """The time the message was delivered."""
  sentAt: DateTime!

  """
  1 for a message from a user, plus 1 for each message before it in its chain.
  """
  chainDepth: Int!

  """True when the target session read the message."""
  isRead: Boolean!
}

"""What happened to a message at one target."""
type SendReceipt {
  """The id of the message, or null when none was made."""
  messageId: ID

  """
  The target session, or null for no match or a session that you cannot see.
  """
  target: Session

  """What happened to the message."""
  outcome: SendOutcome!

  """Why the target refused the message, or null."""
  reason: String
}

"""A filter of sessions. Each field that is set must match."""
input SessionFilter {
  """The absolute path of the working folder. ~ expands."""
  cwd: String

  """The id of the agent."""
  agentId: String

  """A tag that each session has."""
  tag: String

  """The kind of the sessions."""
  kind: SessionKind

  """
  The work state of the sessions. ARCHIVED also finds the sessions that are not live.
  """
  state: SessionState

  """Finds the subagents and the forks of this session."""
  parentId: ID

  """Finds the sessions that this session started."""
  startedById: ID

  """True to also find the sessions that are not live."""
  includeRecorded: Boolean = false

  """The most sessions to give: 1 to 100."""
  limit: Int = 50
}

"""A new root session of an agent, with its first message."""
input StartSessionInput {
  """
  The agent id. With none, the AGENT.md of the folder, else the default agent.
  """
  agentId: String

  """
  The absolute path of an existing folder. ~ expands. With none, the default folder.
  """
  cwd: String

  """The first message. The new agent sees only this text."""
  message: String!

  """The tags of the new session."""
  tags: [String!]

  """The title of the new session."""
  title: String
}

"""The tags to add to a session."""
input TagSessionInput {
  """
  The session id, in any letter case. A session that you cannot see, or that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """
  The tags to add. A tag has 1 to 64 characters: letters, digits, -, _, : and .
  """
  tags: [String!]!
}

"""The tags to remove from a session."""
input UntagSessionInput {
  """
  The session id, in any letter case. A session that you cannot see, or that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The tags to remove."""
  tags: [String!]!
}

"""The new title of a session."""
input RenameSessionInput {
  """
  The session id, in any letter case. A session that you cannot see, or that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The new title."""
  title: String!
}

"""The session to archive."""
input ArchiveSessionInput {
  """
  The session id, in any letter case. A session that you cannot see is NOT_FOUND.
  """
  id: ID!
}

"""A message and its address."""
input SendMessageInput {
  """
  The address: a session id, @agent, @agent:/path, an absolute folder path, or #tag. An external client gives a session id. A session that you cannot see is NOT_FOUND. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  to: String!

  """The full text. The target sees only this text."""
  message: String!
}

"""
A reply to a message that a session got. It goes to the session that sent the message.
"""
input ReplyMessageInput {
  """
  The session that got the message. A session that you cannot see is NOT_FOUND.
  """
  sessionId: ID!

  """
  The id of the message to answer. The reply goes to its sender: a sender that you cannot see makes the message NOT_FOUND. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  inReplyTo: ID!

  """The full text. The target sees only this text."""
  message: String!
}

type Query {
  """
  The sessions on this server that match the filter, the newest first. An external client sees only the sessions that it owns, their subagents, and the sessions that they started.
  """
  sessions(
    """The filter. With no filter, each live session."""
    filter: SessionFilter
  ): [Session!]!

  """One session, or null when no session that you can see has the id."""
  session(
    """The session id, in any letter case."""
    id: ID!
  ): Session

  """
  The unread messages to a session, the oldest first. The query does not mark them read: only the session itself reads its inbox. A session that you cannot see gives none.
  """
  inbox(
    """The session whose messages to read."""
    sessionId: ID!

    """The most messages to give: 1 to 100."""
    limit: Int = 50
  ): [Message!]!
}

type Mutation {
  """
  Starts a new root session of an agent. It works in the background, and only your client opens it in a tab. An external client cannot start a session.
  """
  startSession(
    """The agent, the folder and the first message."""
    input: StartSessionInput!
  ): Session!

  """Adds tags to a session. Gives the session with its tags."""
  tagSession(
    """The session and the tags."""
    input: TagSessionInput!
  ): Session!

  """
  Removes tags from a session. Gives the session with the tags that stay.
  """
  untagSession(
    """The session and the tags."""
    input: UntagSessionInput!
  ): Session!

  """Sets the title of a session."""
  renameSession(
    """The session and its new title."""
    input: RenameSessionInput!
  ): Session!

  """
  Archives a session: stops its turn and ends its work. It takes no more messages, and its transcript stays.
  """
  archiveSession(
    """The session."""
    input: ArchiveSessionInput!
  ): Session!

  """
  Sends a message from you to a session, an agent, a folder or a tag. Gives what happened at each target. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  sendMessage(
    """The address and the text."""
    input: SendMessageInput!
  ): [SendReceipt!]!

  """
  Replies to a message that a session got, from you. Gives what happened at each target. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  replyMessage(
    """The session that got the message, the message and the text."""
    input: ReplyMessageInput!
  ): [SendReceipt!]!
}
