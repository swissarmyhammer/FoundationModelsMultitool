"""
The session of another agent to continue, and the folder and the name of the new session.
"""
input ContinueExternalSessionInput {
  """The source agent: claude-code or codex."""
  source: String!

  """The sourceId of the session, from externalSessions."""
  id: String!

  """
  The absolute path of the folder of the new session. ~ expands. For the agent, . is the folder of its session. A client has no session, so . gives INVALID_FOLDER. None: the working folder of the source session.
  """
