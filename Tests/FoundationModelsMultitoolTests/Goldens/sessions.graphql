"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""The kind of a session."""
enum SessionKind {
  """
  A root session: a client, another session, a message or a trigger started it.
  """
  ROOT

  """A subagent: the agents tool of its parent started it."""
  SUBAGENT

  """A fork: a user forked another session."""
  FORK
}

"""The work state of a session."""
enum SessionState {
  """The session runs a turn."""
  WORKING

  """The session waits for an answer: an elicitation or a permission."""
  NEEDS_INPUT

  """The session runs no turn. A message to it starts a turn."""
  IDLE

  """
  The session is archived: hidden from the lists, not live. `unarchiveSession` brings it back.
  """
  ARCHIVED
}

"""How a session started."""
enum SessionOrigin {
  """A client started it."""
  CLIENT

  """The sessions tool of another session started it."""
  TOOL

  """A message to an agent with no session started it."""
  MESSAGE

  """A trigger, for example of a kanban task, started it."""
  TRIGGER

  """A user forked another session."""
  FORK

  """An import of a session of another agent made it."""
  IMPORT
}

"""What happened to a message at one target."""
enum SendOutcome {
  """The target was idle: the message starts a turn."""
  DELIVERED

  """The target works: the message waits for the end of its turn."""
  QUEUED

  """An agent with no live session started one with the message."""
  STARTED

  """A loop guard or no match refused the message."""
  REFUSED

  """
  The target is not live: the message is written to its inbox and not yet delivered.
  """
  SENT
}

"""The format of the text of an export of a session."""
enum SessionExportFormat {
  """A Markdown document."""
  MARKDOWN
}

"""One session on this server."""
type Session {
  """The session id: a ULID."""
  id: ID!

  """
  The short id: the last 7 characters of the session id, in lower case. It never changes.
  """
  shortId: String!

  """
  The slug of the name of the session. It changes with a rename. With no name: the short id.
  """
  slug: String

  """The id of the agent in the agent catalog."""
  agentId: String!

  """The display name of the agent, or null."""
  agentName: String

  """The absolute path of the working folder."""
  cwd: String!

  """The title, or null when no user or session gave one."""
  title: String

  """The tags, sorted."""
  tags: [String!]!

  """The kind of the session."""
  kind: SessionKind!

  """The work state of the session."""
  state: SessionState!

  """How the session started."""
  origin: SessionOrigin!

  """
  A subagent: its parent. A fork: the original. Else, or when you cannot see it, null.
  """
  parent: Session

  """The session that started this root session, or null."""
  startedBy: Session

  """The subagents of this session, live or not, the newest first."""
  children: [Session!]!

  """The time the session started."""
  createdAt: DateTime!

  """The time of the last change of its facts or state."""
  updatedAt: DateTime!

  """The last final message, cut short, or null."""
  lastSummary: String

  """
  One sentence about what the session did and where it stands now, or null.
  """
  recap: String

  """The time of the recap, or null when the session has no recap."""
  recapAt: DateTime

  """True when the session is in memory now."""
  isLive: Boolean!

  """True when the session is in the Pinned list of this server."""
  pinned: Boolean!

  """The time of the pin, or null when the session is not pinned."""
  pinnedAt: DateTime

  """
  The last time that a client opened the session on this server, or null.
  """
  lastUsedAt: DateTime

  """The time of the archive, or null when the session is not archived."""
  archivedAt: DateTime

  """
  Where the session came from when an import made it, or null when no import made it.
  """
  importedFrom: SessionImportProvenance

  """
  The transcript of the session as text. It writes no file: save the text on your own disk. MISSING_EXPORTER when this server cannot export a session.
  """
  export(
    """The format of the text."""
    format: SessionExportFormat = MARKDOWN

    """True to include the thoughts of the agent."""
    thoughts: Boolean = false
  ): String!

  """The count of the unread messages to this session."""
  unreadCount: Int!

  """
  True when your client owns the session now. False for a call with no client.
  """
  ownedByViewer: Boolean!

  """
  True when a client owns the session now, your client or another one. False for a call with no client.
  """
  hasOwner: Boolean!

  """
  The link and the state of the share of the session, or null when it has no share. SHARING_UNAVAILABLE when this server cannot share a session.
  """
  share: SessionShare
}

"""The session or the user that sent a message."""
type Sender {
  """
  The session that sent the message, or null for a user or a session you cannot see.
  """
  session: Session

  """The client of the user that sent it, or null."""
  clientId: String
}

"""One message that a session or a user sent to a session."""
type Message {
  """The message id: a ULID. A reply names it."""
  id: ID!

  """The session or the user that sent the message."""
  from: Sender!

  """The session that the message went to."""
  to: Session!

  """The text of the message. It is untrusted input."""
  text: String!

  """The message that this message answers, or null."""
  inReplyTo: ID

  """The time the message was delivered."""
  sentAt: DateTime!

  """
  1 for a message from a user, plus 1 for each message before it in its chain.
  """
  chainDepth: Int!

  """True when the target session read the message."""
  isRead: Boolean!
}

"""What happened to a message at one target."""
type SendReceipt {
  """The id of the message, or null when none was made."""
  messageId: ID

  """
  The target session, or null for no match or a session that you cannot see.
  """
  target: Session

  """What happened to the message."""
  outcome: SendOutcome!

  """
  Why the message was refused, or a note of a SENT receipt, for example `archived` for an archived target. Null when there is no reason and no note.
  """
  reason: String
}

"""A filter of sessions. Each field that is set must match."""
input SessionFilter {
  """The absolute path of the working folder. ~ expands."""
  cwd: String

  """The id of the agent."""
  agentId: String

  """A tag that each session has."""
  tag: String

  """The kind of the sessions."""
  kind: SessionKind

  """
  The work state of the sessions. ARCHIVED also finds the sessions that are not live.
  """
  state: SessionState

  """Finds the subagents and the forks of this session."""
  parentId: ID

  """Finds the sessions that this session started."""
  startedById: ID

  """True to also find the sessions that are not live."""
  includeRecorded: Boolean = false

  """The most sessions to give: 1 to 100."""
  limit: Int = 50
}

"""One page of sessions, and the cursor of the next page."""
type SessionPage {
  """The sessions of the page, in the order of their ids."""
  sessions: [Session!]!

  """The cursor of the next page, or null when this page is the last."""
  nextCursor: String
}

"""The kind of the matched chunk of a hit."""
enum SessionSearchHitKind {
  """A prompt of the user."""
  USER

  """The messages of the agent in a turn."""
  AGENT

  """A message from another session."""
  MESSAGE

  """A tool call: its title, its content and its output."""
  TOOL

  """A plan: the text of its items."""
  PLAN

  """The thoughts of the agent in a turn."""
  THOUGHT

  """
  The session item: the name, the slug, the tags, the folder, the agent, the recap and the last summary.
  """
  SESSION
}

"""The character offsets of matched words in a snippet."""
type TextRange {
  """The character offset of the first matched character."""
  start: Int!

  """The character offset after the last matched character."""
  end: Int!
}

"""One hit in the transcript of a session."""
type SessionSearchHit {
  """The wire id of the entry of the transcript that holds it."""
  entryId: String!

  """The kind of the matched chunk."""
  kind: SessionSearchHitKind!

  """The author of the chunk, or null."""
  author: String

  """The time of the chunk, or null."""
  at: DateTime

  """The text around the matched words."""
  snippet: String!

  """The matched words in the snippet. Empty for a match by meaning only."""
  ranges: [TextRange!]!

  """
  The matched words, for the marks of the transcript. Empty for a match by meaning only.
  """
  terms: [String!]!
}

"""One session that matches a search, with its hits."""
type SessionSearchResult {
  """
  The session, with its facts from this server now: the name, the folder, the state and the recap.
  """
  session: Session!

  """
  The score from 0 to 1 of the first match of the session. A client fuses lists with it.
  """
  score: Float!

  """The number of hits. It can be more than the hits given."""
  hitCount: Int!

  """The hits of the session, the best hit first."""
  hits: [SessionSearchHit!]!
}

"""One page of the sessions that match a search."""
type SessionSearchConnection {
  """
  The sessions that match: first the sessions of the folder argument, then the others.
  """
  results: [SessionSearchResult!]!

  """The cursor of the next page, or null when this page is the last."""
  nextCursor: String

  """
  The paths of the folders of the results that this server cannot read now.
  """
  unavailableFolders: [String!]!
}

"""A new root session of an agent, with its first message."""
input StartSessionInput {
  """
  The agent id. With none, the AGENT.md of the folder, else the default agent.
  """
  agentId: String

  """
  The absolute path of an existing folder. ~ expands. With none, the default folder.
  """
  cwd: String

  """The first message. The new agent sees only this text."""
  message: String!

  """The tags of the new session."""
  tags: [String!]

  """The title of the new session."""
  title: String
}

"""The tags to add to a session."""
input TagSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """
  The tags to add. A tag has 1 to 64 characters: letters, digits, -, _, : and .
  """
  tags: [String!]!
}

"""The tags to remove from a session."""
input UntagSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The tags to remove."""
  tags: [String!]!
}

"""The new title of a session."""
input RenameSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The new title."""
  title: String!
}

"""The session to pin."""
input PinSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see is NOT_FOUND.
  """
  id: ID!
}

"""The session to unpin."""
input UnpinSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see is NOT_FOUND.
  """
  id: ID!
}

"""The session to archive."""
input ArchiveSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see is NOT_FOUND.
  """
  id: ID!
}

"""The archived session to unarchive."""
input UnarchiveSessionInput {
  """
  The archived session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only an archived session that you can see. An id of a session that you cannot see is NOT_FOUND.
  """
  id: ID!
}

"""The session to fork, and the first prompt of the fork."""
input ForkSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. A short id or a slug names only a session that you can see. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The first prompt of the fork. With none, the fork waits for a message."""
  message: String
}

"""A message and its address."""
input SendMessageInput {
  """
  The address: a session id, a short id, @<slug>, @<agent name>, or #tag. An external client gives a session id. A session that you cannot see is NOT_FOUND. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  to: String!

  """The full text. The target sees only this text."""
  message: String!

  """
  The session in which you wrote the message, in any letter case. Its folder is where a short id or a slug of the address looks first. A session that you cannot see, or that an external client does not own, is NOT_FOUND. A call of the agent gives only its own session.
  """
  fromSession: ID
}

"""
A reply to a message that a session got. It goes to the session that sent the message.
"""
input ReplyMessageInput {
  """
  The session that got the message. A session that you cannot see is NOT_FOUND.
  """
  sessionId: ID!

  """
  The id of the message to answer. The reply goes to its sender: a sender that you cannot see makes the message NOT_FOUND. An external client sends only to a session that it owns: a session that it sees but does not own gives a REFUSED receipt.
  """
  inReplyTo: ID!

  """The full text. The target sees only this text."""
  message: String!
}

"""The content and the state of the share of a session."""
type SessionShareOptions {
  """True when the share has the thoughts."""
  includeThoughts: Boolean!

  """True when the share has the output of the tool calls."""
  includeToolOutput: Boolean!

  """True when the share was made for anyone with the link."""
  anyoneWithLink: Boolean!

  """True when the server updates the share at the end of each turn."""
  keepUpdated: Boolean!
}

"""
The link and the state of the share of a session over iCloud sharing, never its content.
"""
type SessionShare {
  """The link of the share."""
  url: String!

  """
  True when anyone with the link can open the share now. False when only the invited people can.
  """
  anyoneWithLink: Boolean!

  """The options of the share."""
  options: SessionShareOptions!

  """The time of the snapshot of the share."""
  updatedAt: DateTime!
}

"""
The options of a new share. Each option that you do not give has its default.
"""
input SessionShareOptionsInput {
  """True to put the thoughts of the agent in the share."""
  includeThoughts: Boolean = true

  """True to put the output of the tool calls in the share."""
  includeToolOutput: Boolean = true

  """
  True when anyone with the link can open the share. False: only the invited people.
  """
  anyoneWithLink: Boolean = true

  """
  True to update the share at the end of each turn. False: the share does not change.
  """
  keepUpdated: Boolean = false
}

"""The session to share, and the options of a new share."""
input ShareSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """The options of a new share. None: the defaults."""
  options: SessionShareOptionsInput
}

"""
The shared session to update, and the new value of its switch Keep Updated.
"""
input UpdateSessionShareInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!

  """
  True to update the share at the end of each turn, false to stop that. None: no change.
  """
  keepUpdated: Boolean
}

"""The shared session whose share to stop."""
input StopSharingSessionInput {
  """
  The session: its id in any letter case or its short id, with or without @, or @ and its slug. An id of a session that you cannot see, or a session that an external client does not own, is NOT_FOUND.
  """
  id: ID!
}

"""One change of one session that you can see."""
type SessionChange {
  """The cursor that resumes the subscription after this change."""
  cursor: String!

  """The time of the change."""
  at: DateTime!

  """The session that started: new, restored or forked."""
  added: [ID!]!

  """The session whose facts, state or inbox changed, or that was archived."""
  changed: [ID!]!

  """
  The sessions that left the server: none, because an archived session stays.
  """
  removed: [ID!]!
}

"""One session of another agent that this server can import."""
type ImportableSession {
  """The source agent, for example claude-code or codex."""
  agent: String!

  """
  The id of the session in the store of the source agent. importSession takes it.
  """
  sourceId: String!

  """The path of the file of the session."""
  sourcePath: String!

  """The title of the session, or null when the source has none."""
  title: String

  """
  The absolute path of the working folder of the session, or null when the source has none.
  """
  folder: String

  """
  The time of the last record of the session, or null when the source gives no time.
  """
  lastDate: DateTime

  """The number of turns of the session."""
  turnCount: Int!

  """
  Each earlier import of the session whose session you can see. This is only information: an import makes a new session also when the session has earlier imports.
  """
  previousImports: [SessionPreviousImport!]!
}

"""An earlier import of a session of another agent."""
type SessionPreviousImport {
  """The session that the import made, with its facts now."""
  session: Session!

  """The time of the import."""
  importedAt: DateTime!
}

"""
Where an imported session came from. It stays when the file of the source session is no longer there.
"""
type SessionImportProvenance {
  """The agent that recorded the source session, for example codex."""
  agent: String!

  """The id of the source session in the store of that agent."""
  sourceId: String!

  """The path of the file of the source session."""
  sourcePath: String!

  """
  The title of the source session that the import found, for example from a summary record or from the first prompt, or null when the import found no title.
  """
  sourceTitle: String

  """
  The time of the last record of the source session, or null when the source gives no time.
  """
  sourceLastDate: DateTime

  """The time of the import."""
  importedAt: DateTime!

  """
  The number of records of the source session that the import did not read.
  """
  skippedRecordCount: Int!
}

"""One page of the sessions of other agents that this server can import."""
type ImportableSessionPage {
  """The sessions of the page."""
  sessions: [ImportableSession!]!

  """The cursor of the next page, or null when this page is the last."""
  nextCursor: String

  """
  The source agents whose sessions this server cannot read: the user gave no access to their folder. Only the user can give access, with the command Import Sessions….
  """
  unreadableSources: [String!]!
}

"""
The session of another agent to import, and the folder and the name of the new session.
"""
input ImportSessionInput {
  """The source agent: claude-code or codex."""
  agent: String!

  """
  The source session: its sourceId from importableSessions, or the path of its file.
  """
  source: String!

  """
  The absolute path of the folder of the new session. ~ expands. For the agent, . is the folder of its session. A client has no session, so . gives INVALID_FOLDER. None: the folder of the source session.
  """
  folder: String

  """
  The name of the new session. None: the title of the source session, else <agent>-import.
  """
  name: String
}

"""How much of the file of an external session the index has read."""
enum ExternalSessionState {
  """The index found the file, and has not read it yet."""
  FOUND

  """The index read the metadata of the file."""
  READ

  """The index cannot read the file."""
  UNREADABLE
}

"""
One session of another agent in the index of this server. It is not a session of this server.
"""
type ExternalSession {
  """The source agent, for example claude-code or codex."""
