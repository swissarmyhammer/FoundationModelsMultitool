  """
  The name of the project folder of the file, or null when the source has none.
  """
  projectKey: String

  """The size of the file, in bytes."""
  size: Float!

  """The time of the last change of the file."""
  modified: DateTime!

  """
  The absolute path of the working folder of the session, or null when it is not known.
  """
  cwd: String

  """The git branch of the session, or null."""
  gitBranch: String

  """
  True when a program started the session. False for a session that a person typed.
  """
  isAutomated: Boolean!

  """The title of the session, or null."""
  title: String

  """The first prompt, cut short, or null."""
  firstPrompt: String

  """The last prompt, cut short, or null."""
  lastPrompt: String

  """The time of the first record, or null."""
  firstDate: DateTime

  """The time of the last record, or null."""
  lastDate: DateTime

  """How much of the file the index has read."""
