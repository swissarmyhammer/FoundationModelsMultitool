<!DOCTYPE html>
<html>
<head><title>Headings and Lists</title></head>
<body>
<h1>Main   heading</h1>
<p>An intro paragraph
   that runs over two lines.</p>
<h2>Fruit</h2>
<ul>
  <li>Apple</li>
  <li>Banana
    <ul>
      <li>Cavendish</li>
      <li>Plantain</li>
    </ul>
  </li>
  <li>Cherry</li>
</ul>
<h3>Steps</h3>
<ol start="3">
  <li>Open the box.</li>
  <li>Read the <strong>manual</strong>.</li>
</ol>
<p>Last paragraph.</p>
</body>
</html>
